---
- name: Seed Jenkins jobs via Job DSL
  hosts: jenkins
  become: true
  vars:
    seed_script: /var/lib/jenkins/seed/job-seed.groovy
  tasks:
    - name: Create seed directory
      file:
        path: /var/lib/jenkins/seed
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'
    - name: Copy Job DSL script
      copy:
        src: ../../cd-pipeline/job-seed.groovy
        dest: "{{ seed_script }}"
        owner: jenkins
        group: jenkins
        mode: '0644'
    - name: Run Job DSL via Jenkins CLI
      shell: |
        java -jar /var/cache/jenkins/war/WEB-INF/jenkins-cli.jar -s http://localhost:8080/ -auth admin:{{ jenkins_admin_password }} groovy = < {{ seed_script }}
      register: cli_out
    - debug:
        var: cli_out.stdout
